name: Lab Tests

# Five independent gates:
#   validate   - pure-Python structural checks over every lab file (the badge)
#   terraform  - fmt -check + init + validate on each terraform/examples/* dir
#   docker     - hadolint on every Dockerfile, + a real multi-stage build
#   kubernetes - kubeconform schema validation on every manifest
#   parts_2_5  - the shared renderer (assets/course.js) + course data for
#                learn2-5 (Terraform/IaC at scale, Kubernetes platform
#                engineering, networking & security, observability), and any
#                lab configs landing under learnN/labs/

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structural lab checks
        run: python lab/validate.py

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: terraform fmt (check, recursive)
        run: terraform fmt -check -recursive terraform/
      - name: terraform init + validate each example
        run: |
          set -e
          for d in terraform/examples/*/; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false -no-color
            terraform -chdir="$d" validate -no-color
            echo "::endgroup::"
          done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint every Dockerfile
        run: |
          # DL3018/DL3008: pinning apk/apt versions is noisy for a teaching repo.
          # failure-threshold=warning: info-level style hints don't fail CI.
          IGNORE="--ignore DL3018 --ignore DL3008 --failure-threshold warning"
          docker pull -q hadolint/hadolint:latest
          found=0 ; rc=0
          while IFS= read -r df; do
            found=$((found+1))
            echo "::group::hadolint $df"
            docker run --rm -i hadolint/hadolint:latest hadolint $IGNORE - < "$df" || rc=1
            echo "::endgroup::"
          done < <(find docker -name Dockerfile -type f | sort)
          echo "linted $found Dockerfile(s)"
          test "$found" -ge 3 || rc=1
          exit $rc
      - name: Real multi-stage build
        run: docker build -t devops-infra/demo:ci docker/examples/multistage

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform (strict, k8s 1.30)
        run: |
          docker run --rm -v "$PWD":/work -w /work ghcr.io/yannh/kubeconform:latest \
            -strict -summary -ignore-missing-schemas \
            -kubernetes-version 1.30.0 \
            kubernetes/manifests

  parts_2_5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax-check the shared renderer and every course data file
        run: |
          node --check assets/course.js
          for f in $(find learn2 learn3 learn4 learn5 -path '*/assets/*' -name '*.js'); do
            echo "check $f"; node --check "$f"
          done

      - name: Each new part has a manifest and at least chapter 1
        run: |
          for p in learn2 learn3 learn4 learn5; do
            test -f "$p/assets/manifest.js" || { echo "missing $p/assets/manifest.js"; exit 1; }
            test -f "$p/assets/ch/01.js"   || { echo "missing $p/assets/ch/01.js"; exit 1; }
          done

      - name: Lint any lab YAML under learnN/labs/ (if present)
        run: |
          python -m pip install --quiet yamllint
          shopt -s globstar nullglob
          files=(learn2/labs/**/*.y*ml learn3/labs/**/*.y*ml learn4/labs/**/*.y*ml learn5/labs/**/*.y*ml)
          if [ ${#files[@]} -gt 0 ]; then
            yamllint -d "{extends: relaxed, rules: {line-length: disable, truthy: disable}}" "${files[@]}"
          else
            echo "no learnN/labs YAML yet"
          fi

      - name: Validate any lab JSON under learnN/labs/ (if present)
        run: |
          shopt -s globstar nullglob
          for f in learn2/labs/**/*.json learn3/labs/**/*.json learn4/labs/**/*.json learn5/labs/**/*.json; do
            echo "json $f"; python -m json.tool "$f" > /dev/null
          done

      - name: Shell scripts under learnN/labs/ — parse + shellcheck (if present)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null
          shopt -s globstar nullglob
          for f in learn2/labs/**/*.sh learn3/labs/**/*.sh learn4/labs/**/*.sh learn5/labs/**/*.sh; do
            echo "check $f"; bash -n "$f"; shellcheck "$f"
          done

      - name: Compile-check + run any zero-dep Python labs under learnN/labs/
        run: |
          shopt -s globstar nullglob
          for f in learn2/labs/**/*.py learn3/labs/**/*.py learn4/labs/**/*.py learn5/labs/**/*.py; do
            echo "compile $f"; python -m py_compile "$f"
          done

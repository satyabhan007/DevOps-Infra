# Part 5 lab — scrapes the OTel Collector's Prometheus exporter and
# evaluates the burn-rate rules from ../../alerting/slo-burn-rate-rules.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    lab: devops-infra-part5

rule_files:
  - /etc/prometheus/rules/slo-burn-rate-rules.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

# Part 5 lab — minimal single-binary Tempo config: receive OTLP from the
# collector, store traces on local disk (fine for a lab, not for prod).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

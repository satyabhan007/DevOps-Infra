# Canary rollout of "recommendations" v2: internal callers that opt in via
# an "x-canary: true" header always hit v2 (fast feedback for the team
# that owns it); everyone else gets a 90/10 weighted split so a bad
# canary only affects 10% of production traffic before it's rolled back.
# See Chapter 13, "Service Mesh with Istio".
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: recommendations
spec:
  hosts:
    - recommendations.storefront.svc.cluster.local
  http:
    - match:
        - headers:
            x-canary:
              exact: "true"
      route:
        - destination:
            host: recommendations.storefront.svc.cluster.local
            subset: v2
    - route:
        - destination:
            host: recommendations.storefront.svc.cluster.local
            subset: v1
          weight: 90
        - destination:
            host: recommendations.storefront.svc.cluster.local
            subset: v2
          weight: 10
      timeout: 2s
      retries:
        attempts: 2
        perTryTimeout: 500ms
        retryOn: 5xx,reset,connect-failure

# Defines the two subsets (stable v1, canary v2) that the VirtualService's
# weighted routes select between. Subsets are just a label selector over
# Pods already distinguished by a "version" label on their Deployments.
# See Chapter 13, "Service Mesh with Istio".
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: recommendations
spec:
  host: recommendations.storefront.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2

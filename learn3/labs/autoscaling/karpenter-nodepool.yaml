# Karpenter provisions right-sized nodes per-pod rather than per-ASG:
# no pre-defined instance-type list to maintain, bin-packing decided at
# schedule time. See Chapter 15, "Cluster Autoscaling: Karpenter vs.
# Cluster Autoscaler".
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        provisioner: karpenter
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      expireAfter: 720h
  limits:
    cpu: "1000"
    memory: 1000Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
---
# The cloud-provider-specific half: which AMI, subnets, security groups
# and instance profile Karpenter is allowed to launch nodes with.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  role: KarpenterNodeRole-platform-cluster
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: platform-cluster
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: platform-cluster
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  tags:
    managed-by: karpenter
    environment: production

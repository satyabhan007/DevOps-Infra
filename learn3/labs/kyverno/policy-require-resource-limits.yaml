# Every container must declare CPU + memory requests and limits, so a
# single misbehaving Pod can't starve its node's other tenants.
# See Chapter 11, "Policy as Code with Kyverno".
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Requests and Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Requires that all containers have CPU and memory resource requests
      and limits set. This prevents noisy-neighbor issues and gives the
      scheduler the data it needs to bin-pack the cluster safely.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: >-
          CPU and memory requests and limits are required on every
          container and initContainer.
        foreach:
          - list: "request.object.spec.containers"
            pattern:
              resources:
                requests:
                  cpu: "?*"
                  memory: "?*"
                limits:
                  cpu: "?*"
                  memory: "?*"

# EnvironmentClaim: a namespaced CR an internal developer platform (IDP)
# exposes so app teams can self-serve short-lived preview/dev environments
# without filing a ticket. A controller (see controller/) watches these and
# reconciles them into a Namespace + ResourceQuota + NetworkPolicy, then
# tears the environment down once it expires.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: environmentclaims.platform.example.com
spec:
  group: platform.example.com
  names:
    kind: EnvironmentClaim
    listKind: EnvironmentClaimList
    plural: environmentclaims
    singular: environmentclaim
    shortNames:
      - envclaim
      - ec
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Template
          type: string
          jsonPath: .spec.template
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Expires
          type: string
          jsonPath: .status.expiresAt
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - owner
                - template
              properties:
                owner:
                  type: string
                  description: >-
                    Slack handle or email of the requester; used for
                    notifications and cost attribution.
                  minLength: 1
                template:
                  type: string
                  description: Sizing preset applied to the generated ResourceQuota.
                  enum:
                    - small
                    - medium
                    - large
                ttlHours:
                  type: integer
                  description: Hours of inactivity-free life before automatic teardown.
                  minimum: 1
                  maximum: 720
                  default: 48
                namespaceSuffix:
                  type: string
                  description: >-
                    Appended to "env-<owner>-" when generating the target
                    namespace name. Defaults to a random 5-char suffix.
                  pattern: '^[a-z0-9]([a-z0-9-]{0,20}[a-z0-9])?$'
                networkIsolation:
                  type: boolean
                  description: Deny cross-namespace traffic via NetworkPolicy.
                  default: true
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Provisioning
                    - Ready
                    - Expiring
                    - Terminated
                    - Failed
                namespace:
                  type: string
                  description: The namespace the controller provisioned for this claim.
                expiresAt:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time

# 03 — configuration outside the image. Same image, every environment;
# only the ConfigMap/Secret change. Rebuild-to-reconfigure is an
# anti-pattern.
#
#   kubectl apply -f 03-config-secret.yaml
#   kubectl exec deploy/api -- env | grep -E 'LOG_LEVEL|FEATURE_'
#
# Gotcha: env vars from a ConfigMap are injected ONCE at Pod start.
# Editing the ConfigMap does NOT restart Pods — you need a rollout
# (`kubectl rollout restart deploy/api`) or a mounted volume (which DOES
# update live, after a delay).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  LOG_LEVEL: "info"
  FEATURE_NEW_CART: "true"
  application.yaml: |
    server:
      port: 8080
    cache:
      ttlSeconds: 300
---
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
type: Opaque
stringData:
  # stringData is written by you in plaintext; the API server base64s it.
  # This is NOT encryption — anyone with `get secret` RBAC can read it.
  # Real clusters add: encryption-at-rest for etcd + an external manager
  # (External Secrets Operator, Vault, cloud secret store) + tight RBAC.
  DATABASE_URL: "postgres://api:s3cr3t@postgres:5432/api"
  JWT_SIGNING_KEY: "replace-via-external-secrets-operator"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        # Force a rollout when config changes: templating tools (Helm,
        # Kustomize) set this to a hash of the ConfigMap/Secret.
        checksum/config: "replace-with-config-hash"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: ghcr.io/acme/api:v3.1.0
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/api
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: api-config
            items:
              - key: application.yaml
                path: application.yaml

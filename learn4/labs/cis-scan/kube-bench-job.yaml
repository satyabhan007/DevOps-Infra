# Runs aquasecurity/kube-bench as a one-shot Job against a cluster node to
# check it against the CIS Kubernetes Benchmark. Schedule this per node
# role (control-plane vs. worker) since the two roles are checked against
# different sections of the benchmark.
#
# This example targets a worker node - swap --targets to "master" (or the
# version-specific target kube-bench reports for control-plane nodes) and
# the nodeSelector/tolerations to run it against a control-plane node
# instead.
apiVersion: v1
kind: Namespace
metadata:
  name: cis-scan
  labels:
    app.kubernetes.io/part-of: cis-scan
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-bench-node
  namespace: cis-scan
  labels:
    app.kubernetes.io/name: kube-bench
    app.kubernetes.io/part-of: cis-scan
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-bench
    spec:
      restartPolicy: Never
      hostPID: true # required: kube-bench inspects host process args (e.g. kubelet flags)
      containers:
        - name: kube-bench
          image: docker.io/aquasec/kube-bench:v0.9.3
          command: ["kube-bench", "run", "--targets", "node"]
          volumeMounts:
            - name: var-lib-etcd
              mountPath: /var/lib/etcd
              readOnly: true
            - name: var-lib-kubelet
              mountPath: /var/lib/kubelet
              readOnly: true
            - name: var-lib-kube-scheduler
              mountPath: /var/lib/kube-scheduler
              readOnly: true
            - name: var-lib-kube-controller-manager
              mountPath: /var/lib/kube-controller-manager
              readOnly: true
            - name: etc-systemd
              mountPath: /etc/systemd
              readOnly: true
            - name: lib-systemd
              mountPath: /lib/systemd/
              readOnly: true
            - name: srv-kubernetes
              mountPath: /srv/kubernetes/
              readOnly: true
            - name: etc-kubernetes
              mountPath: /etc/kubernetes
              readOnly: true
            - name: usr-bin
              mountPath: /usr/local/mount-from-host/bin
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: var-lib-etcd
          hostPath:
            path: /var/lib/etcd
        - name: var-lib-kubelet
          hostPath:
            path: /var/lib/kubelet
        - name: var-lib-kube-scheduler
          hostPath:
            path: /var/lib/kube-scheduler
        - name: var-lib-kube-controller-manager
          hostPath:
            path: /var/lib/kube-controller-manager
        - name: etc-systemd
          hostPath:
            path: /etc/systemd
        - name: lib-systemd
          hostPath:
            path: /lib/systemd
        - name: srv-kubernetes
          hostPath:
            path: /srv/kubernetes
        - name: etc-kubernetes
          hostPath:
            path: /etc/kubernetes
        - name: usr-bin
          hostPath:
            path: /usr/bin
